<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link
      rel="shortcut icon"
      href="./icons/leader-favicon-32x32.ico"
      type="image/x-icon"
    />
    <title>Leader Classic</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="header__container container">
        <a class="logo header__logo" href="#">
          <img
            class="logo__img"
            src="./icons/logo.svg"
            width="52"
            height="66"
            alt="Логотип Leader Classic"
          />
          <div class="logo__text">
            <span class="logo__text-link">Leader</span>
            <span class="logo__text-link">Classic</span>
          </div>
        </a>
        <div class="header__language">
          <img
            src="./icons/russian-icon.svg"
            width="23"
            height="23"
            alt="Эмблема русского флага"
          />
          <select class="header__language-list" name="language">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="zh">中文</option>
          </select>
        </div>
        <nav class="menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__item-link" href="#rates">Тарифы</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#bonus">Бонус</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#referral">Реферальная</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#contact">Контакты</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <button class="button button__tertiary">Войти</button>
          <button class="button button__secondary">Открыть счёт</button>
      </div>
    </header>
  </body>
</html>
