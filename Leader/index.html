<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link
      rel="shortcut icon"
      href="./icons/leader-favicon-32x32.ico"
      type="image/x-icon"
    />
    <script defer src="./js/index.js" type="module"></script>
    <title>Leader Classic</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="header__container container">
        <button
          class="header__burger burger"
          aria-label="Открыть меню"
          aria-expanded="false"
          aria-controls="menu"
        >
          <svg width="28" height="28">
            <use
              class="burger__icon-menu"
              href="./icons/sprite.svg#burger-menu"
            ></use>
            <use
              class="burger__icon-cross"
              href="./icons/sprite.svg#cross-menu"
            ></use>
          </svg>
        </button>
        <a class="logo header__logo" href="/">
          <svg width="52" height="66">
            <use class="logo__img" href="./icons/logo.svg"></use>
          </svg>
          <div class="logo__text">
            <span class="logo__text-link">Leader</span>
            <span class="logo__text-link">Classic</span>
          </div>
        </a>
        <div class="header__language">
          <img
            src="./icons/russian-icon.svg"
            width="23"
            height="23"
            alt="Эмблема русского флага"
          />
          <select class="header__language-list" name="language">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="zh">中文</option>
          </select>
        </div>
        <nav class="menu" id="menu" aria-label="Главное меню">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__item-link" href="#rates">Тарифы</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#bonus">Бонус</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#referral">Реферальная</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#contact">Контакты</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <button class="button button__tertiary">Войти</button>
          <button class="button button__secondary">Открыть счёт</button>
        </div>
      </div>
    </header>
    <section class="promo-bar">
      <div class="promo-bar__container container">
        <img src="./image/present.png" width="62" height="62" alt="Подарок" />
        <div class="promo-bar__wrapper">
          <h2 class="promo-bar__title">Станьте миллионером с Leader Classic</h2>
          <p class="promo-bar__text">
            Откройте счет, инвестируйте в фонды Leader Classic и получите шанс
            выиграть один из 100 000 000
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
